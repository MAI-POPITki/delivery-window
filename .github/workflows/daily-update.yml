# Ежедневное обновление: докачивает свежую погоду ERA5 для всех точек, перепроверяет данные,
# пересобирает страницу проекта и коммитит результат. После пуша Streamlit Cloud и GitHub Pages
# обновляются сами. Модели М1 не переобучаются (новые сезоны с фактическими датами не появляются);
# полный пересчёт (run_all.py) — ручным запуском с галочкой full.
name: Ежедневное обновление данных

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 06:00 МСК = 12:00 Якутск
  workflow_dispatch:
    inputs:
      full:
        description: "Полный пересчёт (данные, проверки, обучение М1, «до/после», сайт)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Свежая погода ERA5 (докачка хвоста)
        run: python scripts/download_data.py --weather --gauges

      - name: Есть ли новые данные
        id: diff
        run: |
          if git diff --quiet -- data/weather; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Новых данных о погоде нет"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Полный пересчёт
        if: ${{ inputs.full }}
        run: python run_all.py

      - name: Проверки данных и страница проекта
        if: ${{ !inputs.full && steps.diff.outputs.changed == 'true' }}
        run: |
          python scripts/validate_data.py
          python scripts/build_site.py

      - name: Коммит и пуш
        if: ${{ inputs.full || steps.diff.outputs.changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports docs models
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          last=$(tail -n 1 data/weather/yakutsk_crossing.csv | cut -d, -f2)
          git commit -m "Автообновление данных: погода по ${last}"
          git pull --rebase
          git push
