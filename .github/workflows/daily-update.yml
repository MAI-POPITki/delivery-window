# Ежедневное обновление: докачивает свежую погоду ERA5 и оперативный прогноз на 16 дней,
# докачивает новые снимки Sentinel-1 над Леной (таблица data/s1/index.csv), записывает журнал прогнозов,
# перепроверяет данные,
# пересобирает страницу проекта и коммитит результат. После пуша Streamlit Cloud и GitHub Pages
# обновляются сами. Модели М1 не переобучаются (новые сезоны с фактическими датами не появляются);
# полный пересчёт (run_all.py) — ручным запуском с галочкой full.
name: Ежедневное обновление данных

on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC = 06:00 МСК = 12:00 Якутск
  workflow_dispatch:
    inputs:
      full:
        description: "Полный пересчёт (данные, проверки, обучение М1, «до/после», сайт)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # точек стало больше (посты PANGAEA, паводки): загрузка погоды не укладывалась в 60 мин
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Зависимости
        run: pip install -r requirements.txt

      - name: Свежая погода ERA5 (докачка хвоста)
        timeout-minutes: 75
        continue-on-error: true   # частичная докачка лучше, чем пропуск журнала прогнозов и коммита
        run: python scripts/download_data.py --weather --gauges --lena --recent

      - name: Прогноз высокой воды GloFAS (четыре региона)
        continue-on-error: true   # старый прогноз станет серым через 48 ч; данные не подменяются
        run: |
          python scripts/download_flood.py
          python scripts/validate_flood.py

      - name: Высота снежного покрова ERA5-Land (докачка хвоста)
        timeout-minutes: 20
        continue-on-error: true   # без свежего снега прогноз использует М1 без снежной поправки
        run: python scripts/download_snow_data.py --recent

      - name: Архив прогнозов GFS для погодной модели закрытия
        continue-on-error: true   # при недоступности архива дашборд использует обычную М1
        run: python scripts/download_weather_forecasts.py --live

      - name: Новые снимки Sentinel-1 над Леной (для М2)
        continue-on-error: true   # недоступность сервиса снимков не должна ломать обновление погоды
        run: |
          pip install -r requirements-data.txt
          python scripts/s1_chips.py --days 10 --no-preview
          python scripts/m2_predict.py   # М2: лёд/вода на новых снимках, автодаты событий, автофакты журнала

      - name: Новые снимки открытой воды Sentinel-2 (М2 паводков)
        continue-on-error: true   # нет сцены/снег/облака не подменяются отсутствием воды
        run: |
          pip install -r requirements-data.txt
          python scripts/download_flood_m2.py --recent --days 14
          python scripts/validate_flood_m2.py

      - name: Есть ли новые данные
        id: diff
        run: |
          if git diff --quiet -- data/weather data/snow_depth && [ -z "$(git ls-files --others --exclude-standard data/weather data/snow_depth)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Новых данных о погоде нет"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Журнал прогнозов (каждый день, даже без новых данных архива)
        if: ${{ !inputs.full }}
        run: python scripts/forecast_journal.py

      - name: Полный пересчёт
        if: ${{ inputs.full }}
        run: python run_all.py

      - name: Проверки данных и страница проекта
        if: ${{ !inputs.full && steps.diff.outputs.changed == 'true' }}
        run: |
          python scripts/validate_data.py
          python scripts/build_site.py

      - name: Коммит и пуш
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports docs models
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          last=$(tail -n 1 data/weather/yakutsk_crossing.csv | cut -d, -f2)
          git commit -m "Автообновление: погода по ${last}, журнал прогнозов $(date +%F)"
          git pull --rebase
          git push
